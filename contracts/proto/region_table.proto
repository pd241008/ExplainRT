syntax = "proto3";

package explainrt.contracts.v1;

// Canonical region-table reference (Rust peparse output).
// The full region table is bulk Parquet; this is the control-plane reference
// used by the gate and stages.
message RegionTable {
  string schema_version = 1;
  string producer = 2;
  string git_sha = 3;
  string tool_version = 4;
  InputHashes input_hashes = 5;
  string output_hash = 6;
  uint64 row_count = 7;
}

message InputHashes {
  string manifest = 1;
}
