[project]
name = "bytelens"
version = "0.1.0"
description = "Explanation-aware robustness of image-based malware classifiers: PE-valid problem-space attacks, Grad-CAM faithfulness, and Explanation-Consistency Training (ECT)."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["bytelens", "runner", "logger", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # long lines allowed in docstrings/comments; keep code tidy
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning:bytelens.*",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
